<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de margem e preço de venda</title>
<style>
  :root {
    --bg: #eef2f5;
    --card: #ffffff;
    --ink: #17212b;
    --muted: #5d6b79;
    --line: #cfd8e0;
    --accent: #0f766e;
    --accent-soft: #d9f0ec;
    --bad: #b42318;
    --bad-soft: #fde8e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11181f;
      --card: #1a232c;
      --ink: #e8eef3;
      --muted: #94a3b0;
      --line: #2e3b47;
      --accent: #4fd1c0;
      --accent-soft: #163a38;
      --bad: #ff8a80;
      --bad-soft: #3a1f1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 460px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }

  .tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--line); border-radius: 10px; padding: 3px; gap: 3px;
    margin-bottom: 16px;
  }
  .tabs button {
    border: 0; background: transparent; color: var(--muted);
    padding: 10px 8px; border-radius: 8px; font: inherit; font-size: .9rem;
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    background: var(--card); color: var(--ink); font-weight: 600;
  }
  .tabs button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px;
  }
  label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  .input-wrap { position: relative; }
  .input-wrap span {
    position: absolute; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none;
  }
  .input-wrap .pre { left: 12px; }
  .input-wrap .suf { right: 12px; }
  input, select {
    width: 100%; font: inherit; font-size: 1.05rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px;
  }
  input.money { padding-left: 38px; }
  input.pct { padding-right: 34px; }

  .result {
    margin-top: 4px; padding: 16px; border-radius: 10px;
    background: var(--accent-soft);
  }
  .result.neg { background: var(--bad-soft); }
  .result .big { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1.1; }
  .result.neg .big { color: var(--bad); }
  .result .name { font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
  .rows { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .row { display: flex; justify-content: space-between; font-size: .95rem; padding: 3px 0; }
  .row b { font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: .9rem; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Calculadora de margem</h1>
  <p class="sub">Descubra a margem ou o preço de venda. O resultado atualiza enquanto você digita.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-margem" aria-selected="true">Calcular margem</button>
    <button role="tab" id="tab-preco" aria-selected="false">Calcular preço</button>
  </div>

  <div class="card">
    <div class="field">
      <label for="base">Base do percentual</label>
      <select id="base">
        <option value="margem">Margem (lucro ÷ valor de venda)</option>
        <option value="markup">Markup (lucro ÷ custo)</option>
      </select>
    </div>

    <div class="field">
      <label for="custo">Custo</label>
      <div class="input-wrap">
        <span class="pre">R$</span>
        <input id="custo" class="money" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
      </div>
    </div>

    <div class="field" id="f-venda">
      <label for="venda">Valor de venda</label>
      <div class="input-wrap">
        <span class="pre">R$</span>
        <input id="venda" class="money" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
      </div>
    </div>

    <div class="field" id="f-pct" hidden>
      <label for="pct" id="pct-label">Margem desejada</label>
      <div class="input-wrap">
        <input id="pct" class="pct" type="text" inputmode="decimal" placeholder="0" autocomplete="off">
        <span class="suf">%</span>
      </div>
    </div>

    <div id="out" aria-live="polite">
      <p class="hint">Preencha os campos para ver o resultado.</p>
    </div>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  let modo = 'margem'; // 'margem' = custo + venda; 'preco' = custo + % desejado

  const brl = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const pctFmt = n => n.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%';

  // Aceita "1.234,56", "1234,56" e "1234.56"
  function num(txt) {
    let s = String(txt).trim().replace(/[^\d.,-]/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    return parseFloat(s);
  }

  function setModo(m) {
    modo = m;
    $('tab-margem').setAttribute('aria-selected', m === 'margem');
    $('tab-preco').setAttribute('aria-selected', m === 'preco');
    $('f-venda').hidden = m !== 'margem';
    $('f-pct').hidden = m !== 'preco';
    calcular();
  }

  function atualizarRotulo() {
    $('pct-label').textContent =
      $('base').value === 'margem' ? 'Margem desejada' : 'Markup desejado';
  }

  function render(titulo, valor, linhas, negativo) {
    $('out').innerHTML =
      `<div class="result${negativo ? ' neg' : ''}">
         <div class="name">${titulo}</div>
         <div class="big">${valor}</div>
         <div class="rows">${linhas.map(l =>
           `<div class="row"><span>${l[0]}</span><b>${l[1]}</b></div>`).join('')}</div>
       </div>`;
  }

  function aviso(msg) { $('out').innerHTML = `<p class="hint">${msg}</p>`; }

  function calcular() {
    atualizarRotulo();
    const base = $('base').value;
    const custo = num($('custo').value);

    if (modo === 'margem') {
      const venda = num($('venda').value);
      if (isNaN(custo) || isNaN(venda)) return aviso('Preencha o custo e o valor de venda.');
      if (venda <= 0 || custo < 0) return aviso('Informe valores maiores que zero.');

      const lucro = venda - custo;
      const margem = lucro / venda * 100;
      const markup = custo > 0 ? lucro / custo * 100 : NaN;
      const principal = base === 'margem' ? margem : markup;
      if (isNaN(principal)) return aviso('Para calcular o markup, o custo deve ser maior que zero.');

      render(
        base === 'margem' ? 'Margem de lucro' : 'Markup',
        pctFmt(principal),
        [
          ['Lucro', brl(lucro)],
          ['Custo', brl(custo)],
          ['Valor de venda', brl(venda)],
          [base === 'margem' ? 'Markup' : 'Margem', pctFmt(base === 'margem' ? markup : margem)]
        ],
        lucro < 0
      );
    } else {
      const p = num($('pct').value);
      if (isNaN(custo) || isNaN(p)) return aviso('Preencha o custo e o percentual desejado.');
      if (custo < 0) return aviso('O custo não pode ser negativo.');
      if (base === 'margem' && p >= 100) return aviso('A margem sobre a venda precisa ser menor que 100%.');

      const venda = base === 'margem' ? custo / (1 - p / 100) : custo * (1 + p / 100);
      const lucro = venda - custo;
      const margem = venda > 0 ? lucro / venda * 100 : 0;
      const markup = custo > 0 ? lucro / custo * 100 : NaN;

      render(
        'Valor de venda',
        brl(venda),
        [
          ['Lucro', brl(lucro)],
          ['Custo', brl(custo)],
          ['Margem', pctFmt(margem)],
          ['Markup', isNaN(markup) ? '—' : pctFmt(markup)]
        ],
        lucro < 0
      );
    }
  }

  ['custo', 'venda', 'pct'].forEach(id => $(id).addEventListener('input', calcular));
  $('base').addEventListener('change', calcular);
  $('tab-margem').addEventListener('click', () => setModo('margem'));
  $('tab-preco').addEventListener('click', () => setModo('preco'));
</script>
</body>
</html>
